name: 'Skillproof: Evaluate Skill Adoption'
description: 'Verify that Claude agent skills are correctly adopted in your codebase'
author: 'konradschewe'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  skills-dir:
    description: 'Path to the directory containing SKILL.md files'
    required: true
  provider:
    description: 'LLM provider: anthropic or aicore'
    default: 'anthropic'
  anthropic-api-key:
    description: 'Anthropic API key (required when provider is anthropic)'
    required: false
  aicore-service-key:
    description: 'SAP AI Core service key JSON from BTP (required when provider is aicore)'
    required: false
  aicore-resource-group:
    description: 'SAP AI Core resource group (optional, default: "default")'
    required: false
  filter:
    description: 'Only evaluate skills whose name contains this substring'
    required: false
  system-prompt:
    description: 'Additional system prompt context for the evaluator agent (e.g. to describe the nature of the repository)'
    required: false
  verbose:
    description: 'Stream agent thinking and tool calls to stderr'
    default: 'false'
  strict:
    description: 'Require exact API names and patterns. By default, functionally equivalent implementations are accepted.'
    default: 'false'
  concurrency:
    description: 'Number of skills to evaluate in parallel'
    default: '1'
  output-format:
    description: 'Output format: markdown, json, github-summary, or html'
    default: 'github-summary'
  output-file:
    description: 'Write output to this file path'
    required: false
  publish-pages:
    description: >
      Publish an HTML report to GitHub Pages.
      Requires contents: write permission in the calling workflow and GitHub Pages enabled
      (Settings → Pages → Source: Deploy from branch gh-pages).
    default: 'false'
  pages-destination-dir:
    description: 'Subdirectory on GitHub Pages to publish the report to'
    default: 'skillproof'
  cache-dir:
    description: 'Directory to store the evaluation cache. Persisted across runs via actions/cache.'
    default: '.skillproof-cache'

outputs:
  report-path:
    description: 'Path to the generated report file (set when output-file is given or publish-pages is true)'
    value: ${{ steps.run.outputs.report-path }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Restore Skillproof cache
      uses: actions/cache@v4
      with:
        path: ${{ inputs.cache-dir }}
        key: skillproof-v1-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          skillproof-v1-${{ runner.os }}-

    - name: Run Skillproof
      id: run
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        AICORE_SERVICE_KEY: ${{ inputs.aicore-service-key }}
        AICORE_RESOURCE_GROUP: ${{ inputs.aicore-resource-group }}
        npm_config_ignore_scripts: 'false'
        INPUT_SKILLS_DIR: ${{ inputs.skills-dir }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_FILTER: ${{ inputs.filter }}
        INPUT_SYSTEM_PROMPT: ${{ inputs.system-prompt }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_PUBLISH_PAGES: ${{ inputs.publish-pages }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_CACHE_DIR: ${{ inputs.cache-dir }}
      run: |
        OUTPUT_FORMAT="$INPUT_OUTPUT_FORMAT"
        OUTPUT_FILE="$INPUT_OUTPUT_FILE"

        if [ "$INPUT_PUBLISH_PAGES" = "true" ] && [ -z "$OUTPUT_FILE" ]; then
          OUTPUT_FORMAT="html"
          OUTPUT_FILE="index.html"
        fi

        [ -n "$OUTPUT_FILE" ] && echo "report-path=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"

        export OUTPUT_FORMAT OUTPUT_FILE
        node -e "
          const path = require('path');
          const ws = process.env.GITHUB_WORKSPACE || process.cwd();
          const abs = (p) => p && (path.isAbsolute(p) ? p : path.resolve(ws, p));
          const config = {
            skillsDir: abs(process.env.INPUT_SKILLS_DIR),
            provider: process.env.INPUT_PROVIDER,
            outputFormat: process.env.OUTPUT_FORMAT,
            verbose: process.env.INPUT_VERBOSE === 'true',
            strict: process.env.INPUT_STRICT === 'true',
            concurrency: Number(process.env.INPUT_CONCURRENCY) || 1,
          };
          if (process.env.OUTPUT_FILE)        config.outputFile   = abs(process.env.OUTPUT_FILE);
          if (process.env.INPUT_FILTER)       config.filter       = process.env.INPUT_FILTER;
          if (process.env.INPUT_SYSTEM_PROMPT) config.systemPrompt = process.env.INPUT_SYSTEM_PROMPT;
          if (process.env.INPUT_CACHE_DIR)    config.cacheDir     = abs(process.env.INPUT_CACHE_DIR);
          require('fs').writeFileSync('/tmp/skillproof-config.json', JSON.stringify(config));
        "

        npx --yes "@skillproof/cli@1" --config /tmp/skillproof-config.json

    - name: Prepare GitHub Pages directory
      if: ${{ inputs.publish-pages == 'true' }}
      shell: bash
      env:
        REPORT_PATH: ${{ steps.run.outputs.report-path }}
      run: |
        mkdir -p _skillproof_pages_tmp
        cp "$REPORT_PATH" _skillproof_pages_tmp/index.html

    - name: Publish to GitHub Pages
      if: ${{ inputs.publish-pages == 'true' }}
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ github.token }}
        publish_dir: '_skillproof_pages_tmp'
        destination_dir: ${{ inputs.pages-destination-dir }}
        keep_files: true
